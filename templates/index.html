<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <!-- Подключаем CSS из папки static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <!-- Название сайта с тегом h1 -->
        <h1>Мой Первый Flask Сайт</h1>
        
        <!-- Текст-описание с тегом p -->
        <p>Добро пожаловать! Это простое веб-приложение, созданное на базе микрофреймворка Flask для демонстрации базовой стилизации и структуры проекта.</p>
        
        <!-- Изображение из папки static -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Логотип сайта" class="site-image">
    </div>

</body>
</html>
